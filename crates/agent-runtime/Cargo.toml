[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
description = "HTTP agent runtime: runs Claude Code agents via claude-agent-sdk and fronts the Anthropic Messages API"
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "agent-runtime"
path = "src/main.rs"

[dependencies]
claude-agent-sdk = { path = "../claude-agent-sdk" }
axum = "0.8.9"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
subtle = "2"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
